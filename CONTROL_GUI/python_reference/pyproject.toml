[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tue-usb"
version = "1.0.0"
description = "Deterministic binary CAN-over-USB protocol driver and PyQt6 GUI for STM32F407 motor control"
readme = "README.md"
authors = [{ name = "TUE Robotics Team" }]
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
tue-gui = "gui.app:run_app"
